name: CI/CD

# NOTE: GitHub only runs workflows located at <repository-root>/.github/workflows. If this project is not the repository
# root, copy this file there and prefix the paths (or set `defaults.run.working-directory`).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/autonomous-it-ops-copilot-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/autonomous-it-ops-copilot-frontend

jobs:
  # ---- Stage 1-3: checkout, unit tests, linting ---------------------------------------------------------------
  backend-test:
    name: Backend unit tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest tests
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+psycopg://copilot:ci-only-password@localhost:5432/copilot
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://copilot:ci-only-password@localhost:5432/copilot
        run: python -m pytest tests
      - name: Agent evaluation gate (detection >= 90%, RCA >= 85%, remediation coverage >= 70%)
        run: python -m agents.evaluation.harness --seeds 3

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install ruff
      - run: ruff check .

  frontend:
    name: Frontend lint, type-check, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  iac-validate:
    name: Validate Helm / Kubernetes / Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint + render
        run: |
          helm lint deployment/helm/autonomous-it-ops-copilot
          helm template copilot deployment/helm/autonomous-it-ops-copilot > /tmp/rendered.yaml
      - name: kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/rendered.yaml deployment/kubernetes/[0-9]*.yaml
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform validate
        working-directory: deployment/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  # ---- Stage 4: security scan ---------------------------------------------------------------------------------
  security:
    name: Security scan (Bandit, pip-audit, Trivy, SonarQube)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements*.txt}
      - run: pip install bandit pip-audit
      - name: Bandit (static analysis)
        run: bandit -r backend agents rag workflows services monitoring infrastructure -c pyproject.toml -ll
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt
      - name: Trivy filesystem scan (vulnerabilities, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-dirs: frontend/node_modules,.venv
      - name: SonarQube scan
        if: ${{ vars.SONAR_HOST_URL != '' }}
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ---- Stage 5-6: docker build + image push -------------------------------------------------------------------
  build-and-push:
    name: Build, scan and push images
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint, frontend, iac-validate, security]
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Trivy image scan (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy image scan (frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Push images
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.tag }}

  # ---- Stage 7-8: deploy to Kubernetes (ArgoCD + Helm) and smoke test ----------------------------------------
  deploy-staging:
    name: Deploy to staging (ArgoCD) + smoke test
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Sync ArgoCD application with the new image tag
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          ./argocd app set copilot-staging --grpc-web \
            --helm-set backend.image.tag="$TAG" --helm-set frontend.image.tag="$TAG"
          ./argocd app sync copilot-staging --grpc-web --prune
          ./argocd app wait copilot-staging --grpc-web --health --timeout 600
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
        run: bash deployment/cicd/smoke_test.sh
      - name: Record deployment in the Copilot (used for RCA correlation)
        env:
          COPILOT_URL: ${{ vars.STAGING_URL }}
          INGEST_API_KEY: ${{ secrets.COPILOT_INGEST_API_KEY }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: bash deployment/cicd/record_deployment.sh staging "$TAG"

  # ---- Stage 9: production deployment (protected environment = manual approval) ------------------------------
  deploy-production:
    name: Production deployment
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Sync ArgoCD application
        env:
          ARGOCD_SERVER: ${{ vars.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          curl -sSfL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          ./argocd app set copilot-production --grpc-web \
            --helm-set backend.image.tag="$TAG" --helm-set frontend.image.tag="$TAG"
          ./argocd app sync copilot-production --grpc-web
          ./argocd app wait copilot-production --grpc-web --health --timeout 900
      - name: Smoke test
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: bash deployment/cicd/smoke_test.sh
      - name: Record deployment
        env:
          COPILOT_URL: ${{ vars.PRODUCTION_URL }}
          INGEST_API_KEY: ${{ secrets.COPILOT_INGEST_API_KEY }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: bash deployment/cicd/record_deployment.sh production "$TAG"
