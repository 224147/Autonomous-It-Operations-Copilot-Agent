# Database migrations run as a one-shot Job (re-create it on every release; with ArgoCD use it as a PreSync hook).
apiVersion: batch/v1
kind: Job
metadata:
  name: copilot-migrate
  namespace: copilot
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata: {labels: {app: copilot-migrate}}
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: ghcr.io/OWNER/autonomous-it-ops-copilot-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: copilot-config}
            - secretRef: {name: copilot-secrets}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {}}
