apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot-backend
  namespace: copilot
  labels: {app: copilot-backend, app.kubernetes.io/part-of: autonomous-it-ops-copilot}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: copilot-backend}}
  template:
    metadata:
      labels: {app: copilot-backend}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: copilot-backend
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app: copilot-backend}}
      containers:
        - name: backend
          image: ghcr.io/OWNER/autonomous-it-ops-copilot-backend:latest   # replaced by kustomize `images:` / Helm values
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: copilot-config}
            - secretRef: {name: copilot-secrets}
          startupProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 5, failureThreshold: 30}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20, timeoutSeconds: 5}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10, timeoutSeconds: 5}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-backend
  namespace: copilot
  labels: {app: copilot-backend}
spec:
  selector: {app: copilot-backend}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: copilot-backend, namespace: copilot}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: copilot-backend}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: copilot-backend, namespace: copilot}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: copilot-backend}}
