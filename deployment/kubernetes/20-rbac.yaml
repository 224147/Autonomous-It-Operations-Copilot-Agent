# Least-privilege permissions the remediation engine needs in the namespace(s) it manages (here: "production").
# Repeat the Role + RoleBinding for every namespace listed in REMEDIATION_ALLOWED_NAMESPACES.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: copilot-backend
  namespace: copilot
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: copilot-remediation
  namespace: production
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: copilot-remediation
  namespace: production
subjects:
  - kind: ServiceAccount
    name: copilot-backend
    namespace: copilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: copilot-remediation
