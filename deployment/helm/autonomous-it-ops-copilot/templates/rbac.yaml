{{- if .Values.remediation.rbac.create }}
{{- $root := . }}
{{- range .Values.remediation.rbac.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "copilot.fullname" $root }}-remediation
  namespace: {{ . }}
  labels: {{- include "copilot.labels" $root | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "copilot.fullname" $root }}-remediation
  namespace: {{ . }}
  labels: {{- include "copilot.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "copilot.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "copilot.fullname" $root }}-remediation
{{- end }}
{{- end }}
