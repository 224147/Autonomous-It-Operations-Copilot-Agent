# Default values. Secrets are NEVER defined here: reference an existing Secret (Vault / External Secrets / CSI driver).
global:
  imagePullSecrets: []

backend:
  image:
    repository: ghcr.io/OWNER/autonomous-it-ops-copilot-backend
    tag: ""                      # defaults to .Chart.AppVersion; CI sets the commit SHA
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1536Mi}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  extraEnv: []                   # additional plain env vars: [{name: X, value: "y"}]

frontend:
  enabled: true
  image:
    repository: ghcr.io/OWNER/autonomous-it-ops-copilot-frontend
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Non-secret application configuration (becomes the ConfigMap; see .env.example for every variable).
config:
  APP_ENV: production
  LOG_JSON: "true"
  LOG_LEVEL: INFO
  DB_AUTO_CREATE: "false"
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CORS_ORIGINS: https://copilot.example.com
  REMEDIATION_MODE: dry_run             # switch to "live" only after validating the approval workflow
  REMEDIATION_ALLOWED_NAMESPACES: production
  AUTO_APPROVE_MAX_RISK: none
  PROMETHEUS_URL: ""
  LOKI_URL: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  HOME: /tmp

# Name of an existing Secret holding DATABASE_URL, REDIS_URL, JWT_SECRET, INGEST_API_KEYS (+ optional OPENAI/AZURE keys,
# BOOTSTRAP_ADMIN_*, ENTRA_*, TICKET_WEBHOOK_TOKEN, VAULT_TOKEN ...).
existingSecret: copilot-secrets

# For throw-away dev clusters ONLY: render a Secret from values. Never commit real values.
secrets:
  create: false
  values: {}

# Namespaces whose workloads the remediation engine may touch. A least-privilege Role/RoleBinding is created in each.
remediation:
  rbac:
    create: true
    namespaces: [production]

serviceAccount:
  create: true
  name: ""
  annotations: {}                # e.g. eks.amazonaws.com/role-arn or azure.workload.identity/client-id

ingress:
  enabled: true
  className: nginx
  host: copilot.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/limit-rps: "50"
  tls:
    enabled: true
    secretName: copilot-tls

migrations:
  enabled: true                   # Helm pre-install/pre-upgrade hook running `alembic upgrade head`

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceMonitor:
  enabled: false                  # requires the Prometheus Operator CRDs
  interval: 30s
