global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: copilot-backend
    metrics_path: /metrics
    # If METRICS_TOKEN is set on the backend, add: authorization: {type: Bearer, credentials_file: /etc/prometheus/metrics-token}
    static_configs:
      - targets: ["backend:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
